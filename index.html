<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUGA STAY Shijo Omiya | House Manual</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #151515;
      --soft-ink: #343434;
      --muted: #77716a;
      --paper: #f6f3ed;
      --white: #ffffff;
      --line: #d8d1c5;
      --line-dark: rgba(255, 255, 255, 0.38);
      --accent: #927244;
      --shadow: 0 20px 50px rgba(17, 17, 17, 0.12);
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.78;
      letter-spacing: 0;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .hero {
      min-height: 86vh;
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: stretch;
      color: var(--white);
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.76), rgba(0, 0, 0, 0.42) 44%, rgba(0, 0, 0, 0.13)),
        url("assets/images/hero-night-exterior.jpg") center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.55), transparent);
      z-index: -1;
    }

    .topbar {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
      padding: 26px 0;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
    }

    .logo-mark {
      width: clamp(148px, 18vw, 225px);
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 2px;
    }

    .language-switcher {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .lang-button {
      min-width: 54px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: var(--white);
      background: rgba(0, 0, 0, 0.12);
      padding: 7px 10px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .lang-button:hover,
    .lang-button.is-active {
      background: var(--white);
      color: var(--ink);
      border-color: var(--white);
    }

    .hero-inner {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
      display: grid;
      align-content: end;
      padding: 8vh 0 5vh;
    }

    .kicker {
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin: 0 0 18px;
    }

    h1 {
      margin: 0;
      max-width: 1080px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 6.4vw, 82px);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: 0;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .hero-subtitle {
      max-width: 700px;
      margin: 24px 0 0;
      font-size: clamp(17px, 2vw, 23px);
      color: rgba(255, 255, 255, 0.9);
    }

    .hero-note {
      max-width: 650px;
      margin: 12px 0 0;
      color: rgba(255, 255, 255, 0.74);
      font-size: 14px;
    }

    .quick-info {
      margin-top: 52px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line-dark);
      border-bottom: 1px solid var(--line-dark);
    }

    .quick-item {
      min-height: 96px;
      padding: 20px 24px;
      border-right: 1px solid var(--line-dark);
    }

    .quick-item:last-child {
      border-right: 0;
    }

    .quick-label {
      display: block;
      color: rgba(255, 255, 255, 0.64);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .quick-value {
      display: block;
      margin-top: 8px;
      font-size: clamp(18px, 2.4vw, 27px);
      line-height: 1.25;
      font-family: Georgia, "Times New Roman", serif;
    }

    .main-shell {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
      padding: 84px 0 110px;
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      gap: clamp(36px, 7vw, 86px);
      align-items: start;
    }

    .toc {
      position: sticky;
      top: 24px;
      border-top: 1px solid var(--ink);
      padding-top: 18px;
    }

    .toc-title {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .toc a {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      transition: color 160ms ease;
    }

    .toc a.is-active,
    .toc a:hover {
      color: var(--ink);
    }

    .toc-index {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--accent);
      font-size: 16px;
    }

    .content {
      display: grid;
      gap: 28px;
    }

    .section {
      padding: clamp(30px, 5vw, 56px) 0;
      border-top: 1px solid var(--line);
      scroll-margin-top: 28px;
    }

    .section:first-child {
      border-top-color: var(--ink);
    }

    .section-head {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 24px;
      margin-bottom: 26px;
    }

    .section-number {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--accent);
      font-size: 34px;
      line-height: 1;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 4vw, 45px);
      line-height: 1.12;
      font-weight: 400;
      letter-spacing: 0;
    }

    .section-body {
      margin-left: 96px;
      display: grid;
      gap: 22px;
    }

    .lead {
      margin: 0;
      max-width: 760px;
      color: var(--soft-ink);
      font-size: 17px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
      min-height: 104px;
    }

    .info-card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.35;
    }

    .info-card span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .image-row {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 14px;
      margin-top: 10px;
    }

    .image-row img,
    .wide-image img {
      width: 100%;
      height: 100%;
      min-height: 230px;
      max-height: 430px;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .wide-image img {
      aspect-ratio: 16 / 9;
    }

    .note {
      margin: 0;
      border-left: 2px solid var(--accent);
      padding: 4px 0 4px 17px;
      color: var(--muted);
      font-size: 14px;
    }

    .device-list {
      display: grid;
      gap: 10px;
    }

    details {
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    summary {
      list-style: none;
      cursor: pointer;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      font-weight: 600;
      color: var(--ink);
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";
      font-family: Georgia, "Times New Roman", serif;
      color: var(--accent);
      font-size: 24px;
      line-height: 1;
    }

    details[open] summary {
      border-bottom: 1px solid var(--line);
    }

    details[open] summary::after {
      content: "-";
    }

    .device-content {
      padding: 18px 20px 22px;
      color: var(--soft-ink);
    }

    .device-content p {
      margin: 0 0 12px;
    }

    .device-content p:last-child {
      margin-bottom: 0;
    }

    .footer {
      background: var(--ink);
      color: var(--white);
      padding: 46px 20px;
      text-align: center;
    }

    .footer img {
      width: 172px;
      margin: 0 auto 18px;
      padding: 12px 14px;
      background: var(--white);
      border-radius: 2px;
    }

    .footer p {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .hero {
        min-height: 820px;
        background-position: 54% center;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .language-switcher {
        justify-content: flex-start;
      }

      .quick-info {
        grid-template-columns: repeat(2, 1fr);
      }

      .quick-item:nth-child(2) {
        border-right: 0;
      }

      .quick-item:nth-child(-n + 2) {
        border-bottom: 1px solid var(--line-dark);
      }

      .main-shell {
        grid-template-columns: 1fr;
        padding-top: 48px;
      }

      .toc {
        position: static;
      }

      .toc nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 18px;
      }

      .section-body {
        margin-left: 0;
      }
    }

    @media (max-width: 640px) {
      .topbar,
      .hero-inner,
      .main-shell {
        width: min(100% - 28px, var(--max));
      }

      .hero {
        min-height: 790px;
      }

      .logo-mark {
        width: 152px;
      }

      .lang-button {
        min-width: 47px;
        padding: 7px 8px;
      }

      .quick-info {
        grid-template-columns: 1fr;
      }

      .quick-item {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line-dark);
        padding: 16px 0;
      }

      .quick-item:last-child {
        border-bottom: 0;
      }

      .toc nav {
        grid-template-columns: 1fr;
      }

      .section-head {
        grid-template-columns: 48px 1fr;
        gap: 14px;
      }

      .section-number {
        font-size: 27px;
      }

      .info-grid,
      .image-row {
        grid-template-columns: 1fr;
      }

      .image-row img,
      .wide-image img {
        min-height: 210px;
        max-height: none;
      }
    }

    @media print {
      body {
        background: #fff;
        color: #111;
      }

      .hero,
      .toc,
      .image-row,
      .wide-image,
      .footer {
        display: none !important;
      }

      .main-shell {
        display: block;
        width: 100%;
        padding: 0;
      }

      .section {
        break-inside: avoid;
        padding: 18px 0;
      }

      .section-body {
        margin-left: 0;
      }

      .info-card,
      details {
        background: #fff;
      }
    }
  </style>
</head>

    const allSectionIds = copy[fallbackLang].sections.map((section) => section.id);

    function sectionNumber(index) {
      return String(index + 1).padStart(2, "0");
    }

    function renderText(lang) {
      const langCopy = copy[lang];
      document.documentElement.lang = lang;
      document.title = langCopy.pageTitle;

      document.querySelectorAll("[data-text]").forEach((node) => {
        const path = node.dataset.text.split(".");
        const value = path.reduce((target, key) => target && target[key], langCopy);
        node.textContent = value || "";
      });

      document.querySelectorAll(".lang-button").forEach((button) => {
        const isActive = button.dataset.lang === lang;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function renderQuickInfo(lang) {
      const quickInfo = document.getElementById("quick-info");
      quickInfo.innerHTML = "";
      copy[lang].quick.forEach(([label, value]) => {
        const item = document.createElement("div");
        item.className = "quick-item";
        item.innerHTML = `<span class="quick-label">${label}</span><span class="quick-value">${value}</span>`;
        quickInfo.appendChild(item);
      });
    }

    function displayTitle(section, lang) {
      return lang === "en" ? section.title : section.label;
    }

    function displayEyebrow(section, lang) {
      return lang === "en" ? section.label : section.title;
    }

    function renderToc(lang) {
      const toc = document.getElementById("toc");
      toc.innerHTML = "";
      copy[lang].sections.forEach((section, index) => {
        const link = document.createElement("a");
        link.href = `#${section.id}`;
        link.dataset.target = section.id;
        link.innerHTML = `<span class="toc-index">${sectionNumber(index)}</span><span>${displayTitle(section, lang)}</span>`;
        toc.appendChild(link);
      });
    }

    function renderCards(cards) {
      if (!cards) return "";
      return `
        <div class="info-grid">
          ${cards.map(([label, text]) => `
            <div class="info-card">
              <strong>${label}</strong>
              <span>${text}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderImages(section) {
      if (!section.images || !section.image) return "";
      if (section.image === "wide") {
        return `<div class="wide-image"><img src="${section.images[0]}" alt="${section.title}"></div>`;
      }
      return `
        <div class="image-row">
          ${section.images.map((src) => `<img src="${src}" alt="${section.title}">`).join("")}
        </div>
      `;
    }

    function renderDevices(devices) {
      if (!devices) return "";
      return `
        <div class="device-list">
          ${devices.map(([title, text]) => `
            <details>
              <summary>${title}</summary>
              <div class="device-content"><p>${text}</p></div>
            </details>
          `).join("")}
        </div>
      `;
    }

    function renderSections(lang) {
      const content = document.getElementById("content");
      content.innerHTML = "";
      copy[lang].sections.forEach((section, index) => {
        const article = document.createElement("article");
        article.className = "section";
        article.id = section.id;
        article.innerHTML = `
          <div class="section-head">
            <div class="section-number">${sectionNumber(index)}</div>
            <div>
              <p class="eyebrow">${displayEyebrow(section, lang)}</p>
              <h2>${displayTitle(section, lang)}</h2>
            </div>
          </div>
          <div class="section-body">
            <p class="lead">${section.lead}</p>
            ${renderCards(section.cards)}
            ${renderDevices(section.devices)}
            ${section.note ? `<p class="note">${section.note}</p>` : ""}
            ${renderImages(section)}
          </div>
        `;
        content.appendChild(article);
      });
    }

    function setActiveToc() {
      const offsets = allSectionIds
        .map((id) => document.getElementById(id))
        .filter(Boolean)
        .map((section) => ({ id: section.id, top: section.getBoundingClientRect().top }));

      let activeId = offsets[0] ? offsets[0].id : allSectionIds[0];
      offsets.forEach((item) => {
        if (item.top <= 120) activeId = item.id;
      });

      document.querySelectorAll(".toc a").forEach((link) => {
        link.classList.toggle("is-active", link.dataset.target === activeId);
      });
    }

    function setLanguage(lang) {
      const nextLang = copy[lang] ? lang : fallbackLang;
      renderText(nextLang);
      renderQuickInfo(nextLang);
      renderToc(nextLang);
      renderSections(nextLang);
      localStorage.setItem("fugastay-house-manual-lang", nextLang);
      window.requestAnimationFrame(setActiveToc);
    }

    document.querySelectorAll(".lang-button").forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.lang));
    });

    window.addEventListener("scroll", setActiveToc, { passive: true });
    window.addEventListener("resize", setActiveToc);

    const savedLang = localStorage.getItem("fugastay-house-manual-lang");
    setLanguage(savedLang || fallbackLang);
  </script>
